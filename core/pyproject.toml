[project]
# PyPI name; the import package is `inline_core` (src/inline_core).
name = "omnichar-core"
version = "1.3.26"
description = "The generation engine behind Inline Studio."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Deliberately torch-free so the engine boots and serves source nodes with no ML stack installed.
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
]

[project.optional-dependencies]
# The one shared model runtime. A new model reuses this; it must never add its own torch block.
runtime = [
  # A bare `torch` is CPU-only on Windows; see [tool.uv] below and requirements.txt.
  "torch>=2.2",
  # Krea 2 needs diffusers >= 0.39 (Krea2Pipeline); Z-Image needs >= 0.36 (ZImagePipeline).
  # Pinned, not floored: MiniMax H3 is vendored from an unmerged PR and imports six symbols
  # from the experimental Modular Diffusers surface, which a minor release may rename.
  "diffusers==0.39.0",
  # Floored at 5.8 because LTX-2.5's text encoder is Gemma 4, which does not exist below it.
  # Capped below 5.15 because 5.15 routes config attribute access through the heterogeneity layer
  # and raises on the global `config.head_dim` that transformers' own Gemma 4 code still reads, so
  # the encoder cannot be built at all. Lightricks verify against 5.14.1; so do we.
  "transformers>=5.8,<5.15",
  "accelerate>=0.30",
  "safetensors>=0.4",
  # LTX-2.5's audio VAE and vocoder; the audio branch raises a bare ImportError without it, which
  # would leave every LTX node advertising an audio port it cannot fill.
  "torchaudio",
  # int8 weight-only quant for smart memory; best-effort at load, falls back if absent.
  "torchao>=0.14",
  # Backs the Beta sigma schedule (diffusers gates use_beta_sigmas on scipy).
  "scipy>=1.11",
  # We call snapshot_download directly for the model popup, so pin it rather than rely on transit.
  # 0.32 is where hf_xet became a hard dependency rather than an extra. Below it, Hugging Face
  # refuses the largest files outright ("too large to be downloaded using the regular download
  # method"), which is every H3 transformer at 66GB.
  "huggingface_hub>=0.32",
  # ControlNet preprocessors (the Apply ControlNet node): OpenPose/DWPose, MiDaS/Zoe depth, canny,
  # HED, lineart, MLSD, scribble, normal. DWPose runs its detector on ONNX Runtime.
  "controlnet-aux>=0.0.7",
  "onnxruntime>=1.17",
  # MiniMax H3's reference node decodes a wired video or audio clip when it builds the reference.
  # The blocks raise a plain ImportError without it, so the node would advertise two ports it
  # cannot read. Video output goes out through ffmpeg, not this.
  "av>=12",
  # Reached only by paths we do not call (LTX's EXR/HDR export and its multi-GPU fleet), but both
  # are imported at module level by the vendored package roots. Two small wheels are a cheaper
  # price than deleting files out of `models/ltx25/vendor/` and making every re-sync a merge.
  "openimageio>=3.0",
  "cloudpickle>=3.1",
  # Tensor reshaping throughout LTX-2.5's vendored transformer and VAEs.
  "einops>=0.7",
]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  # GET /api; capped because the page is built from a keyword surface a major could rename.
  "scalar-fastapi>=1.9,<2",
  # Bundled ffmpeg for the timeline render and audio waveform peaks (ffprobe is not bundled).
  "imageio-ffmpeg>=0.4",
]
# Multi-GPU denoise via xDiT. Install alongside `runtime`: `.[runtime,parallel]`.
parallel = [
  "xfuser>=0.4",
  "nvidia-ml-py>=12",
]
# LoRA training (the Trainer tab): PEFT adapter training + local auto-caption + host/GPU telemetry.
# Install alongside `runtime`: `.[runtime,training]`. Reuses runtime's torch/diffusers/accelerate.
training = [
  "peft>=0.11",
  # 8-bit Adam keeps optimizer state small; no macOS wheels, so skip it there (AdamW fallback).
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "Pillow>=10",
  # Telemetry (CPU/RAM + per-GPU NVML) for the Trainer tab.
  "psutil>=5.9",
  "nvidia-ml-py>=12",
  # Florence-2 auto-captioner is loaded via trust_remote_code and needs these.
  "timm>=1.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1",
  "httpx>=0.27",
]
# Everything a local install needs in one extra: runtime + server + training (the LoRA trainer),
# so `--install --extra all` is a single "install everything" command. Multi-GPU (xfuser, the
# `parallel` extra) is left out on purpose - it is niche and can fail to build on many systems.
# Lists concrete packages, never `omnichar-core[...]` self-refs.
all = [
  # runtime
  "torch>=2.2",
  "diffusers==0.39.0",
  # See the `runtime` extra: floored by LTX-2.5's Gemma 4 encoder, capped by transformers 5.15.
  "transformers>=5.8,<5.15",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "torchaudio",
  "torchao>=0.14",
  # Clip decode for MiniMax H3 and LTX-2.5 LoRA training, and H3's reference node.
  "av>=12",
  "openimageio>=3.0",
  "cloudpickle>=3.1",
  "scipy>=1.11",
  # 0.32 is where hf_xet became a hard dependency rather than an extra. Below it, Hugging Face
  # refuses the largest files outright ("too large to be downloaded using the regular download
  # method"), which is every H3 transformer at 66GB.
  "huggingface_hub>=0.32",
  "controlnet-aux>=0.0.7",
  "onnxruntime>=1.17",
  # server
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "scalar-fastapi>=1.9,<2",
  "imageio-ffmpeg>=0.4",
  # training (the Trainer tab)
  "peft>=0.11",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "Pillow>=10",
  "psutil>=5.9",
  "nvidia-ml-py>=12",
  "timm>=1.0",
  "einops>=0.7",
]

# PyPI ships CPU-only torch on Windows; pin the CUDA index there (pip: see requirements.txt).
# cu126 rather than a newer index because it is the last one still built for sm_50..sm_70 (Maxwell
# through Volta), so it is the safe default for a card we know nothing about. Blackwell (sm_120) has
# no wheel here at all - webui.sh/.bat detect the compute capability and pass the matching index.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Launcher installs pass `--no-sources` so their detected index wins over this pin. That flag is
# broad rather than per-package because the per-package form is too new for the uv versions people
# have. torch being the ONLY entry here is what makes that equivalent: adding another would silently
# start ignoring it on launcher installs too.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[project.scripts]
omnichar = "inline_core.server.__main__:main"
# Kept alongside the new name so an existing install does not lose the command it was started with.
openchar = "inline_core.server.__main__:main"
inline-studio = "inline_core.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inline_core"]
# GET /api serves these from the installed package; a wheel without them 404s its own script tag.
artifacts = ["src/inline_core/server/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream code (see models/minimaxh3/vendor/__init__.py). Editing it to satisfy our
# linters would destroy the one property that makes a re-sync reviewable: it is verbatim.
extend-exclude = ["src/inline_core/models/*/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/models/*/vendor"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `tests` imports as a package: several suites share fixtures via `from tests.x import y`,
# and without it those modules fail to collect and silently stop running.
pythonpath = ["src", "."]
