[project]
name = "omnichar-frontend"
version = "1.3.25"
description = "Prebuilt OmniChar web UI (SPA), served by Inline Core. Mirrors comfyui-frontend-package."
requires-python = ">=3.9"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The payload is the built SPA under omnichar_frontend/static/ (index.html + hashed assets),
# which is a build output and gitignored. `artifacts` tells hatch to include those otherwise-ignored
# files (in both the sdist and the wheel) exactly once - using force-include here instead would add
# them a second time on top of `packages`, which errors with a duplicate index.html.
[tool.hatch.build]
artifacts = ["omnichar_frontend/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["omnichar_frontend"]
